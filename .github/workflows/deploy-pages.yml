name: Deploy demo a GitHub Pages

on:
  push:
    branches: [claude/trade-plate-reader-fxompd]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
        env:
          GH_PAGES: 'true'
          # Key de prueba con límite de gasto, añadida como repository secret.
          # Queda incluida en el JS público del bundle: cualquiera con el
          # link puede extraerla. Úsese solo con una key de gasto limitado,
          # nunca con la key real de producción.
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
